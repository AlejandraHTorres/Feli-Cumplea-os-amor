<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuponera 🎟️</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="valorant-bg">
  <div class="panel-valorant">
    <h2>“Si te caes, te curo.
            Si dudas, te cubro.
            Si el mundo se pone difícil,
            aquí estoy para sostenerte.”</h2>
    <p class="frase">
      “Curarte cuando duela y empujarte cuando olvides lo fuerte que eres.”
    </p>
    <div class="album-cupones">
      <h2>Álbum de cupones 🎟️</h2>
      <p class="subfrase">
        Pequeños regalos que no se compran,  
        se sienten.
      </p>
      <div class="cupon">
        <img id="imgCupon" src="cuponportada.png" alt="Cupón">
        <p id="textoCupon">
          Haz clic para abrir un cupón 💚
        </p>
      </div>
      <button id="btnCupon">
        Abrir cupón
      </button>
    </div>
    <button class="btn-volver" onclick="window.location.href='index.html'">
      Volver al inicio
    </button>
  </div>
  <script src="valorant.js"></script>
</body>
</html>
